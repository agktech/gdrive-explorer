name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-exe.yml'

permissions:
  contents: write

jobs:
  build-exe:
    name: Build GDriveExplorer-Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer (electron-builder / NSIS)
        working-directory: desktop
        run: npm run build:win

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDriveExplorer-Setup
          path: desktop/dist/GDriveExplorer-Setup.exe
          if-no-files-found: error

      - name: Publish installer to release exe-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          name: GDrive Explorer - Windows installer (latest)
          body: |
            GDriveExplorer-Setup.exe - Windows installer for GDrive Explorer.
            It installs a desktop app that loads https://gdrive-explorer.pages.dev
            (same sign-in, drives and data as the web version).
          files: desktop/dist/GDriveExplorer-Setup.exe
          fail_on_unmatched_files: true
